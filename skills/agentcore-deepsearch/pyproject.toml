[project]
name = "agentcore-deepsearch"
version = "0.1.0"
description = "DeepSearch MCP server powered by AWS Bedrock AgentCore cloud browser"
requires-python = ">=3.10"
dependencies = [
    "bedrock-agentcore>=1.14.0",
    "playwright>=1.40.0",
    "trafilatura>=2.0.0",
    "ddgs>=0.1.0",
    "mcp[cli]>=1.2.0",
    "httpx>=0.27.0",
]

[project.scripts]
agentcore-deepsearch = "agentcore_deepsearch.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentcore_deepsearch"]
